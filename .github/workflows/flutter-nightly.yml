name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      android-only:
        description: "Build only Android APKs"
        type: boolean
        default: false

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write  # needed to upload builds to the "nightly" release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      android-only: ${{ inputs.android-only || false }}
